<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #060c18;
}

/* FULLSCREEN FIX */
.fx-shell {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: #060c18;
  position: relative;
  overflow: hidden;
}

.fx-shell::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%, rgba(0,210,255,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 80% 90%, rgba(150,0,255,0.1) 0%, transparent 60%);
  pointer-events: none;
}

.fx-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,210,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,210,255,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

.card {
  width: 100%;
  max-width: 500px;
  position: relative;
  z-index: 2;
  font-family: 'Space Grotesk', sans-serif;
}

.card-inner {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(0,210,255,0.18);
  border-radius: 20px;
  overflow: hidden;
  backdrop-filter: blur(20px);
}

.card-top {
  padding: 26px 26px 20px;
  position: relative;
  border-bottom: 1px solid rgba(0,210,255,0.1);
}

.card-top::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,210,255,0.5), transparent);
}

.scan-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #00d2ff, transparent);
  animation: scan 4s ease-in-out infinite;
}

@keyframes scan {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(330px); opacity: 0; }
}

.id-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.avatar {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  background: linear-gradient(135deg, #00d2ff22, #9600ff22);
  border: 1px solid rgba(0,210,255,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 500;
  color: #00d2ff;
}

.avatar-corner {
  position: absolute;
  width: 8px;
  height: 8px;
  border-color: #00d2ff;
  border-style: solid;
}

.avatar-corner.tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
.avatar-corner.br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

.name {
  font-size: 21px;
  font-weight: 700;
  color: #f0f8ff;
}

.mono-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #00d2ff;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
}

.badge {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 999px;
}

.badge.cyan {
  background: rgba(0,210,255,0.1);
  border: 1px solid rgba(0,210,255,0.35);
  color: #00d2ff;
}

.badge.purple {
  background: rgba(150,0,255,0.1);
  border: 1px solid rgba(150,0,255,0.35);
  color: #c77dff;
}

.badge.gray {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.5);
}

.card-mid {
  padding: 20px 26px;
}

.skills-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.skill {
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 7px;
  font-size: 11px;
  text-align: center;
}

.card-contacts {
  padding: 18px 26px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.c-val {
  font-size: 15px;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
}

.card-actions {
  padding: 16px 26px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.act-btn {
  padding: 10px;
  border-radius: 10px;
  text-align: center;
  text-decoration: none;
}

.act-btn.ghost {
  background: rgba(255,255,255,0.04);
}

.act-btn.glow {
  background: linear-gradient(135deg, rgba(0,210,255,0.15), rgba(150,0,255,0.15));
  color: #00d2ff;
}

.card-footer {
  padding: 12px 26px;
  display: flex;
  justify-content: space-between;
}

/* MOBILE EDGE-TO-EDGE */
@media (max-width: 480px) {
  .card {
    max-width: 100%;
  }

  .card-inner {
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="fx-shell">
  <div class="fx-grid"></div>

  <div class="card">
    <div class="card-inner">

      <div class="card-top">
         <div class="scan-line"></div>
        <div class="id-row">
          <div class="avatar-wrap">
            <div class="avatar">SS</div>
            <div class="avatar-corner tl"></div>
            <div class="avatar-corner br"></div>
          </div>
          <div>
            <div class="name">Suvojit Sengupta</div>
            <div class="mono-sub">PGT_TEACHER @ TECHNO_INDIA_GROUP (MCA)</div>
          </div>
        </div>
      </div>

      <div class="card-contacts">
        <a href="contact.vcf" download class="act-btn glow">Save Contact</a>
        <a href="mailto:suvojit.sengupta.mca@example.com" class="c-val">Email: suvojit.sengupta.mca@example.com</a>
        <a href="tel:+917001671409" class="c-val">Phone: +91 70016 71409</a>
      </div>
      

      <div class="card-actions">
        <a href="https://github.com/suvojitsengupta" target="_blank" class="act-btn ghost">GitHub</a>
        <a href="https://www.linkedin.com/in/suvojit-sengupta-82115820a/" target="_blank" class="act-btn ghost">LinkedIn</a>
        <a href="https://suvojit-sengupta.vercel.app/" target="_blank" class="act-btn glow">Portfolio</a>
      </div>

    </div>
  </div>
</div>

</body>
</html>
